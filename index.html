<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Vinyls0ul Countdown</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 800px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .date {
      opacity: 0.7;
      margin-bottom: 40px;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .box {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px 30px;
      border-radius: 12px;
      min-width: 100px;
    }

    .number {
      font-size: 36px;
      font-weight: bold;
    }

    .label {
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>💕We see each other again in💕:</h1>
  <div class="date">27. März 2026</div>

  <div class="countdown">
    <div class="box">
      <div id="days" class="number">0</div>
      <div class="label">Tage</div>
    </div>
    <div class="box">
      <div id="hours" class="number">0</div>
      <div class="label">Stunden</div>
    </div>
    <div class="box">
      <div id="minutes" class="number">0</div>
      <div class="label">Minuten</div>
    </div>
    <div class="box">
      <div id="seconds" class="number">0</div>
      <div class="label">Sekunden</div>
    </div>
  </div>
</div>

<script>
  const targetDate = new Date("2026-03-27T16:00:00").getTime();

  function updateCountdown() {
    const now = new Date().getTime();
    const diff = targetDate - now;

    if (diff <= 0) {
      document.querySelector(".countdown").innerHTML = "<h2>🎉 Es ist soweit!</h2>";
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("days").innerText = days;
    document.getElementById("hours").innerText = hours;
    document.getElementById("minutes").innerText = minutes;
    document.getElementById("seconds").innerText = seconds;
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

</body>
</html>
