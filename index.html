<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON RUNNER</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
  * { margin:0;padding:0;box-sizing:border-box; }
  body {
    background:#000;display:flex;flex-direction:column;align-items:center;
    justify-content:center;min-height:100vh;overflow:hidden;
    font-family:'Orbitron',monospace;color:#0ff;user-select:none;
  }
  #title {
    font-size:2.2rem;font-weight:900;letter-spacing:0.3em;color:#0ff;
    text-shadow:0 0 10px #0ff,0 0 30px #0ff,0 0 60px #0af;margin-bottom:6px;
  }
  #subtitle { font-size:0.6rem;letter-spacing:0.5em;color:#f0f;text-shadow:0 0 8px #f0f;margin-bottom:16px; }
  #canvas-wrapper { position:relative;border:1px solid #0ff3;box-shadow:0 0 30px #0ff4,0 0 80px #0af2,inset 0 0 30px #0002; }
  canvas { display:block;background:#000; }
  #hud { display:flex;justify-content:space-between;width:100%;padding:8px 4px 0;font-size:0.65rem;letter-spacing:0.15em; }
  .hud-item { color:#0ff;text-shadow:0 0 6px #0ff; }
  .hud-val  { color:#fff;text-shadow:0 0 8px #0ff; }

  /* ── Button layout ── */
  #btn-area { display:flex;gap:20px;margin-top:14px;align-items:center; }
  #move-btns { display:flex;gap:8px;align-items:center; }
  #action-btns { display:flex;flex-direction:column;gap:6px;align-items:center; }

  .ctrl-btn {
    background:transparent;border:1.5px solid #0ff;color:#0ff;
    font-family:'Orbitron',monospace;font-size:0.65rem;font-weight:700;
    letter-spacing:0.12em;padding:10px 18px;cursor:pointer;
    text-shadow:0 0 8px #0ff;box-shadow:0 0 12px #0ff4,inset 0 0 10px #0ff1;
    transition:background 0.08s,box-shadow 0.08s;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }
  .ctrl-btn:active,.ctrl-btn.pressed {
    background:rgba(0,255,255,0.18);box-shadow:0 0 28px #0ff9,inset 0 0 16px #0ff4;
  }
  #btn-jump { padding:12px 24px;font-size:0.7rem; }
  #btn-dash { border-color:#f0f;color:#f0f;text-shadow:0 0 8px #f0f;box-shadow:0 0 12px #f0f4,inset 0 0 10px #f0f1;padding:7px 16px;font-size:0.58rem; }
  #btn-dash:active,#btn-dash.pressed { background:rgba(255,0,255,0.15);box-shadow:0 0 28px #f0f9,inset 0 0 16px #f0f4; }
  #dash-cd-bar { width:80px;height:3px;background:#111;border:1px solid #f0f4;overflow:hidden;box-shadow:0 0 5px #f0f3; }
  #dash-cd-fill { height:100%;background:#f0f;box-shadow:0 0 5px #f0f;width:100%; }
  #controls-hint { margin-top:8px;font-size:0.42rem;letter-spacing:0.18em;color:#0ff4; }

  #cloud-status { font-size:0.38rem;letter-spacing:0.15em;color:#0ff5;margin-top:3px; }
</style>
</head>
<body>
<div id="title">NEON RUNNER</div>
<div id="subtitle">CYBERPUNK EDITION</div>
<div id="canvas-wrapper">
  <canvas id="c" width="800" height="400"></canvas>
  <div id="hud">
    <span class="hud-item">SCORE <span class="hud-val" id="h-score">0</span></span>
    <span class="hud-item">☁ HI <span class="hud-val" id="h-hi">—</span></span>
    <span class="hud-item">LIVES <span class="hud-val" id="h-lives">♥️ ♥️ ♥️</span></span>
    <span class="hud-item">LVL <span class="hud-val" id="h-lvl">1</span></span>
  </div>
</div>

<div id="btn-area">
  <!-- Movement -->
  <div id="move-btns">
    <button class="ctrl-btn" id="btn-left">◀️ LEFT</button>
    <button class="ctrl-btn" id="btn-jump">▲ JUMP</button>
    <button class="ctrl-btn" id="btn-right">RIGHT ▶️</button>
  </div>
  <!-- Actions -->
  <div id="action-btns">
    <button class="ctrl-btn" id="btn-dash">⚡ DASH</button>
    <div id="dash-cd-bar"><div id="dash-cd-fill"></div></div>
  </div>
</div>
<div id="controls-hint">[ ← → ] BEWEGEN &nbsp;|&nbsp; [ SPACE / ↑ ] JUMP &nbsp;|&nbsp; [ SHIFT / Z ] DASH</div>
<div id="cloud-status">☁ CLOUD HIGHSCORE: WIRD GELADEN…</div>

<script>
// ─── Canvas ────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ─── Palette ───────────────────────────────────────────────────
const C = {
  bg:'#000010', ground:'#0ff', player:'#0ff', enemy:'#f0f', coin:'#ff0',
  plat:'#0af', tank:'#f80', laser:'#f00', bomb:'#0f0', swooper:'#c0f', rusher:'#f55'
};

// ─── Cloud Highscore ──────────────────────────────────────────
let cloudHi = 0;
const CLOUD_KEY = 'neonrunner:highscore';

async function loadCloudHi() {
  try {
    const r = await window.storage.get(CLOUD_KEY, true);
    cloudHi = r ? parseInt(r.value) || 0 : 0;
    document.getElementById('cloud-status').textContent =
      cloudHi > 0 ? `☁ CLOUD HIGHSCORE GELADEN: ${cloudHi}` : '☁ CLOUD HIGHSCORE: NOCH KEIN EINTRAG';
  } catch(e) {
    document.getElementById('cloud-status').textContent = '☁ CLOUD HIGHSCORE: OFFLINE';
  }
  updateHUD();
}

async function saveCloudHi(score) {
  if (score <= cloudHi) return;
  cloudHi = score;
  try {
    await window.storage.set(CLOUD_KEY, String(score), true);
    document.getElementById('cloud-status').textContent = `☁ CLOUD HIGHSCORE GESPEICHERT: ${score}`;
  } catch(e) {
    document.getElementById('cloud-status').textContent = '☁ CLOUD: SPEICHERN FEHLGESCHLAGEN';
  }
  updateHUD();
}

loadCloudHi();

// ─── State ─────────────────────────────────────────────────────
let state, localHi = 0;

function mkPlayer() {
  return {
    x:90, y:H-120, w:28, h:36,
    vx:0, vy:0, walkDir:0,
    onGround:false, jumps:0, maxJumps:2,
    dashing:false, dashCd:0, invincible:0, trail:[]
  };
}

function init() {
  state = {
    phase:'title', score:0, lives:3, level:1, speed:3.5,
    player:mkPlayer(),
    platforms:[], enemies:[], coins:[], projectiles:[], particles:[],
    bg:genBgStars(),
    frame:0, spawnTimer:0, secondSpawnTimer:0,
    groundY:H-60, shakeFrames:0, levelUpFlash:0
  };
  updateHUD();
}

function genBgStars() {
  const s = [];
  for(let i=0;i<120;i++)
    s.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.2+0.2, sp:Math.random()*0.3+0.1});
  return s;
}

// ─── Input ─────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  if (!keys[e.code]) { keys[e.code] = true; onKeyDown(e.code); }
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function onKeyDown(code) {
  if (state.phase === 'title' || state.phase === 'dead') {
    if (['Space','ArrowUp','ArrowRight','ArrowLeft','Enter','KeyZ','ShiftLeft','ShiftRight'].includes(code)) startGame();
    return;
  }
  if (state.phase !== 'play') return;
  if (code === 'Space' || code === 'ArrowUp') doJump();
  if (code === 'ShiftLeft' || code === 'ShiftRight' || code === 'KeyZ') doDash();
}

// Continuous key reading in update
function readMovement() {
  let dir = 0;
  if (keys['ArrowLeft']  || keys['KeyA']) dir -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) dir += 1;
  return dir;
}

// ─── Button setup ──────────────────────────────────────────────
const btnHeld = {};
function setupBtn(id, onDown, onUp) {
  const el = document.getElementById(id);
  const down = () => { el.classList.add('pressed'); btnHeld[id] = true; if(onDown) onDown(); };
  const up   = () => { el.classList.remove('pressed'); btnHeld[id] = false; if(onUp) onUp(); };
  el.addEventListener('mousedown',  down);
  el.addEventListener('touchstart', e=>{ e.preventDefault(); down(); }, {passive:false});
  el.addEventListener('mouseup',   up);
  el.addEventListener('touchend',  up);
  el.addEventListener('mouseleave',up);
}

setupBtn('btn-left',  null, null);
setupBtn('btn-right', null, null);
setupBtn('btn-jump',
  () => { if(state.phase==='title'||state.phase==='dead') startGame(); else doJump(); }
);
setupBtn('btn-dash',
  () => { if(state.phase==='title'||state.phase==='dead') startGame(); else doDash(); }
);

function getBtnDir() {
  let d = 0;
  if(btnHeld['btn-left'])  d -= 1;
  if(btnHeld['btn-right']) d += 1;
  return d;
}

// ─── Game flow ─────────────────────────────────────────────────
function startGame() {
  state.phase = 'play';
  state.score = 0; state.lives = 3; state.level = 1; state.speed = 3.2;
  state.player = mkPlayer();
  state.platforms = []; state.enemies = []; state.coins = [];
  state.projectiles = []; state.particles = [];
  state.frame = 0; state.spawnTimer = 0; state.secondSpawnTimer = 0;
  state.shakeFrames = 0; state.levelUpFlash = 0;
  updateHUD();
}

function doJump() {
  const p = state.player;
  if (p.jumps < p.maxJumps) {
    p.vy = p.jumps === 0 ? -13 : -10.5;
    p.jumps++;
    spawnParticles(p.x + p.w/2, p.y + p.h, 8, C.plat, 2);
  }
}

function doDash() {
  const p = state.player;
  if (p.dashCd <= 0) {
    // Dash in the direction the player is moving, or forward by default
    const dir = (readMovement() || getBtnDir()) || 1;
    p.vx = dir * 15; p.dashing = true; p.dashCd = 70;
    spawnParticles(dir < 0 ? p.x + p.w : p.x, p.y + p.h/2, 14, C.player, 3.5);
  }
}

function hurtPlayer(sx, sy, color) {
  const p = state.player;
  if (p.invincible > 0) return;
  state.lives--; p.invincible = 90; state.shakeFrames = 12;
  spawnParticles(sx, sy, 22, color || C.enemy, 4);
  updateHUD();
  if (state.lives <= 0) {
    state.phase = 'dead';
    if (state.score > localHi) localHi = state.score;
    saveCloudHi(state.score);
    updateHUD();
  }
}

// ─── Particles ─────────────────────────────────────────────────
function spawnParticles(x, y, n, color, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (Math.random() * 0.6 + 0.4) * spd;
    state.particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-1,
      life:1, decay:0.025 + Math.random()*0.03, r:2 + Math.random()*3, color});
  }
}

// ─── Spawning ──────────────────────────────────────────────────
function spawnEnemy(typeHint) {
  const g = state.groundY, lvl = state.level;
  const pool = ['ground','fly'];
  if (lvl >= 2) pool.push('rusher');
  if (lvl >= 3) pool.push('swooper','tank');
  if (lvl >= 4) pool.push('shooter');
  if (lvl >= 5) pool.push('bomb');
  const type = typeHint || pool[Math.floor(Math.random() * pool.length)];
  const base = {x:W+55, wave:Math.random()*Math.PI*2, hit:0};
  switch(type) {
    case 'ground':  state.enemies.push({...base,type,y:g-34,w:26,h:34,hp:1,color:C.enemy}); break;
    case 'rusher':  state.enemies.push({...base,type,y:g-34,w:22,h:34,hp:1,color:C.rusher,speedMult:1.85+lvl*0.12}); break;
    case 'fly':     state.enemies.push({...base,type,y:g-95-Math.random()*65,w:26,h:30,hp:1,color:C.enemy}); break;
    case 'swooper': state.enemies.push({...base,type,y:g-170,w:26,h:30,hp:1,color:C.swooper,origY:g-170,diving:false,diveVy:0}); break;
    case 'tank':    state.enemies.push({...base,type,y:g-46,w:38,h:46,hp:2,color:C.tank,speedMult:0.7}); break;
    case 'shooter': state.enemies.push({...base,type,y:g-40,w:28,h:40,hp:1,color:C.laser,
      shootCd:85, shootInterval:Math.max(55,110-lvl*6)}); break;
    case 'bomb':    state.enemies.push({...base,type,y:g-34,w:28,h:34,hp:1,color:C.bomb,fuseTimer:0}); break;
  }
}

function spawnPlatform() {
  const g = state.groundY, lvl = state.level;
  const y = g - 90 - Math.random()*90;
  const moving = lvl >= 3 && Math.random() < 0.38;
  state.platforms.push({x:W+20, y, w:65+Math.random()*55, h:10, hasCoin:Math.random()<0.6,
    coinSpawned:false, moving, moveAmp:40+Math.random()*30,
    moveSpd:0.03+Math.random()*0.025, origY:y, wave:Math.random()*Math.PI*2});
}

function spawnCoin(x, y) {
  state.coins.push({x, y:y-14, w:14, h:14, bob:Math.random()*Math.PI*2, collected:false});
}

// ─── Update ────────────────────────────────────────────────────
function update() {
  if (state.phase !== 'play') return;
  const p = state.player, g = state.groundY;
  state.frame++;
  state.score++;

  // Level every 1800 score (much slower than before)
  const newLvl = 1 + Math.floor(state.score / 1800);
  if (newLvl > state.level) {
    state.level = newLvl;
    state.speed = Math.min(10.5, 3.2 + state.level * 0.48);
    state.levelUpFlash = 70;
    updateHUD();
  }
  if (state.levelUpFlash > 0) state.levelUpFlash--;
  if (state.shakeFrames  > 0) state.shakeFrames--;

  // ── Player movement ──
  const kDir  = readMovement();
  const bDir  = getBtnDir();
  const moveDir = kDir !== 0 ? kDir : bDir;
  p.walkDir = moveDir;

  const walkSpeed = 4.2;
  if (p.dashing) {
    p.vx *= 0.88;
    if (Math.abs(p.vx) < 0.5) { p.dashing = false; p.vx = 0; }
  } else {
    if (moveDir !== 0) {
      p.vx += moveDir * 1.8;
      p.vx = Math.max(-walkSpeed, Math.min(walkSpeed, p.vx));
    } else {
      p.vx *= 0.72; // friction
      if (Math.abs(p.vx) < 0.3) p.vx = 0;
    }
  }

  p.vy += 0.55; // gravity
  p.x += p.vx;
  p.y += p.vy;

  // Horizontal bounds: full canvas width now accessible
  p.x = Math.max(5, Math.min(W - p.w - 5, p.x));

  if (p.dashCd > 0) p.dashCd--;
  if (p.invincible > 0) p.invincible--;

  document.getElementById('dash-cd-fill').style.width = ((1 - p.dashCd/70)*100) + '%';

  // Ground
  p.onGround = false;
  if (p.y + p.h >= g) { p.y = g - p.h; p.vy = 0; p.onGround = true; p.jumps = 0; }

  // Platforms
  for (const pl of state.platforms) {
    if (pl.moving) pl.y = pl.origY + Math.sin(state.frame * pl.moveSpd + pl.wave) * pl.moveAmp;
    if (p.vy >= 0 && p.x + p.w > pl.x && p.x < pl.x + pl.w &&
        p.y + p.h >= pl.y && p.y + p.h <= pl.y + pl.h + 14) {
      p.y = pl.y - p.h; p.vy = 0; p.onGround = true; p.jumps = 0;
    }
  }

  // Trail
  p.trail.push({x:p.x + p.w/2, y:p.y + p.h/2, t:1});
  if (p.trail.length > 12) p.trail.shift();
  p.trail.forEach(t => t.t -= 0.09);

  // ── Spawn logic ──
  state.spawnTimer++;
  const spawnInt = Math.max(48, 120 - state.level * 7);
  if (state.spawnTimer >= spawnInt) {
    state.spawnTimer = 0;
    Math.random() < 0.62 ? spawnEnemy() : spawnPlatform();
  }
  if (state.level >= 3) {
    state.secondSpawnTimer++;
    const si2 = Math.max(55, 165 - state.level * 9);
    if (state.secondSpawnTimer >= si2) {
      state.secondSpawnTimer = 0;
      if (Math.random() < 0.5 + state.level * 0.04) spawnEnemy();
    }
  }
  if (state.level >= 6 && state.frame % 190 === 0) { spawnEnemy(); spawnEnemy(); }
  if (state.level >= 8 && state.frame % 130 === 0) spawnEnemy('rusher');

  // Platforms
  state.platforms = state.platforms.filter(pl => {
    pl.x -= state.speed;
    if (pl.hasCoin && !pl.coinSpawned) { spawnCoin(pl.x + pl.w/2 - 7, pl.y); pl.coinSpawned = true; }
    return pl.x + pl.w > -10;
  });

  // Enemies
  state.enemies = state.enemies.filter(e => {
    const spd = state.speed * (e.speedMult || 1.05);
    e.x -= spd;
    switch(e.type) {
      case 'fly':     e.y += Math.sin(state.frame * 0.05 + e.wave) * 0.8; break;
      case 'swooper':
        if (!e.diving && e.x < p.x + 130 && Math.abs(e.x - p.x) < 160) e.diving = true;
        if (e.diving) { e.diveVy += 0.65; e.y += e.diveVy; }
        if (e.y > g - e.h) { e.y = g - e.h; e.diveVy = 0; e.diving = false; } break;
      case 'shooter':
        e.shootCd--;
        if (e.shootCd <= 0) {
          e.shootCd = e.shootInterval;
          // Aim slightly toward player Y
          const dy = (p.y + p.h/2) - (e.y + e.h/2);
          const dist = Math.hypot(e.x - p.x, dy);
          const vspd = -7 - state.level * 0.3;
          state.projectiles.push({x:e.x, y:e.y+e.h/2-4, w:20, h:8,
            vx: vspd, vy: dist>0 ? (dy/dist)*Math.abs(vspd)*0.35 : 0, color:C.laser});
        } break;
      case 'bomb':
        e.fuseTimer++;
        if (e.fuseTimer > 100 + Math.random()*60) {
          spawnParticles(e.x+e.w/2, e.y+e.h/2, 30, C.bomb, 5);
          const dist = Math.hypot((p.x+p.w/2)-(e.x+e.w/2), (p.y+p.h/2)-(e.y+e.h/2));
          if (dist < 85) hurtPlayer(e.x+e.w/2, e.y+e.h/2, C.bomb);
          return false;
        } break;
    }
    if (p.invincible <= 0 && rectsOverlap(p, e)) {
      if (e.type === 'tank' && e.hp > 1) {
        if (p.dashing) { e.hp--; e.hit = 15; spawnParticles(e.x+e.w/2, e.y+e.h/2, 12, C.tank, 3); }
        else hurtPlayer(e.x+e.w/2, e.y+e.h/2, e.color);
      } else {
        hurtPlayer(e.x+e.w/2, e.y+e.h/2, e.color);
        if (p.dashing) return false;
      }
    }
    if (e.hit > 0) e.hit--;
    return e.x + e.w > -20;
  });

  // Projectiles
  state.projectiles = state.projectiles.filter(pr => {
    pr.x += pr.vx; pr.y += pr.vy;
    spawnParticles(pr.x + pr.w, pr.y + pr.h/2, 1, pr.color, 0.4);
    if (p.invincible <= 0 && rectsOverlap(p, pr)) {
      hurtPlayer(pr.x, pr.y, pr.color);
      spawnParticles(pr.x, pr.y, 14, pr.color, 3);
      return false;
    }
    return pr.x > -30 && pr.x < W + 10 && pr.y > -20 && pr.y < H + 20;
  });

  // Coins
  state.coins = state.coins.filter(c => {
    c.x -= state.speed; c.bob += 0.07; c.y += Math.sin(c.bob) * 0.4;
    if (!c.collected && rectsOverlap(p, c)) {
      c.collected = true; state.score += 150;
      spawnParticles(c.x+c.w/2, c.y+c.h/2, 10, C.coin, 3); updateHUD();
    }
    return c.x > -20 && !c.collected;
  });

  // Particles
  state.particles = state.particles.filter(pt => {
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.1; pt.life -= pt.decay;
    return pt.life > 0;
  });

  // BG stars parallax
  state.bg.forEach(s => { s.x -= s.sp; if (s.x < 0) { s.x = W; s.y = Math.random()*H; } });

  updateHUD();
}

function rectsOverlap(a, b) {
  return a.x+5 < b.x+b.w-5 && a.x+a.w-5 > b.x+5 && a.y+5 < b.y+b.h-5 && a.y+a.h-5 > b.y+5;
}

// ─── Draw ──────────────────────────────────────────────────────
function draw() {
  ctx.save();
  if (state.shakeFrames > 0) {
    ctx.translate((Math.random()-0.5)*state.shakeFrames*1.2, (Math.random()-0.5)*state.shakeFrames*0.8);
  }

  ctx.clearRect(-10,-10,W+20,H+20);
  ctx.fillStyle = '#000010'; ctx.fillRect(-10,-10,W+20,H+20);

  // Perspective grid floor
  ctx.save(); ctx.globalAlpha = 0.07; ctx.strokeStyle = '#0ff'; ctx.lineWidth = 0.5;
  for (let x = (state.frame*2)%60-60; x < W; x += 60) {
    ctx.beginPath(); ctx.moveTo(x, state.groundY); ctx.lineTo(W/2, H+200); ctx.stroke();
  }
  for (let i = 0; i < 8; i++) {
    const y = state.groundY + (i/8)*200;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  ctx.restore();

  // Level-up flash
  if (state.levelUpFlash > 0) {
    ctx.save();
    ctx.globalAlpha = (state.levelUpFlash/70)*0.14;
    ctx.fillStyle = '#0ff'; ctx.fillRect(0,0,W,H);
    ctx.restore();
    neonText(`LEVEL ${state.level}!`, W/2, H/2, 36, '#0ff', 30);
  }

  // Stars
  state.bg.forEach(s => {
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(150,220,255,${0.3+Math.sin(state.frame*0.02+s.x)*0.3})`;
    ctx.fill();
  });

  // Ground glow
  ctx.save();
  ctx.shadowColor = '#0ff'; ctx.shadowBlur = 18;
  ctx.strokeStyle = '#0ff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, state.groundY); ctx.lineTo(W, state.groundY); ctx.stroke();
  const gg = ctx.createLinearGradient(0, state.groundY, 0, H);
  gg.addColorStop(0,'rgba(0,255,255,0.08)'); gg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = gg; ctx.fillRect(0, state.groundY, W, H - state.groundY);
  ctx.restore();

  // Platforms
  state.platforms.forEach(pl => {
    ctx.save();
    const pc = pl.moving ? '#ff0' : C.plat;
    ctx.shadowColor = pc; ctx.shadowBlur = 14;
    ctx.strokeStyle = pc; ctx.lineWidth = 3;
    ctx.strokeRect(pl.x, pl.y, pl.w, pl.h);
    ctx.fillStyle = pl.moving ? 'rgba(255,220,0,0.08)' : 'rgba(0,170,255,0.1)';
    ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
    ctx.restore();
  });

  // Coins
  state.coins.forEach(c => {
    ctx.save();
    ctx.shadowColor = C.coin; ctx.shadowBlur = 16; ctx.fillStyle = C.coin;
    ctx.beginPath(); ctx.arc(c.x+c.w/2, c.y+c.h/2, c.w/2, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  });

  // Projectiles
  state.projectiles.forEach(pr => {
    ctx.save();
    ctx.shadowColor = pr.color; ctx.shadowBlur = 16; ctx.fillStyle = pr.color;
    ctx.fillRect(pr.x, pr.y, pr.w, pr.h);
    ctx.restore();
  });

  // Enemies
  state.enemies.forEach(e => {
    ctx.save();
    ctx.shadowColor = e.color; ctx.shadowBlur = 20;
    if (e.hit > 0 && Math.floor(e.hit/3)%2===0) ctx.globalAlpha = 0.4;
    ctx.fillStyle = e.color;
    switch(e.type) {
      case 'tank':
        ctx.fillRect(e.x,e.y,e.w,e.h);
        ctx.save(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.globalAlpha=0.35;
        ctx.strokeRect(e.x+3,e.y+3,e.w-6,e.h-6); ctx.restore();
        if (e.hp>1) { ctx.fillStyle='#fff'; ctx.fillRect(e.x+5,e.y-7,e.w-10,4); }
        break;
      case 'shooter':
        ctx.fillRect(e.x,e.y,e.w,e.h);
        ctx.fillStyle='#f88'; ctx.fillRect(e.x-14,e.y+e.h/2-4,14,8);
        ctx.shadowColor='#f00'; ctx.shadowBlur=12; ctx.fillStyle='#f00';
        ctx.fillRect(e.x+4,e.y+10,8,8); break;
      case 'bomb': {
        ctx.beginPath(); ctx.arc(e.x+e.w/2,e.y+e.h/2,e.w/2,0,Math.PI*2); ctx.fill();
        const fuseA = 0.5+0.5*Math.sin(state.frame*(0.1+e.fuseTimer*0.003));
        ctx.save(); ctx.globalAlpha=fuseA; ctx.fillStyle='#ff0';
        ctx.beginPath(); ctx.arc(e.x+e.w/2,e.y+4,4,0,Math.PI*2); ctx.fill(); ctx.restore(); break;
      }
      case 'rusher':
        ctx.fillRect(e.x,e.y,e.w,e.h);
        ctx.save(); ctx.globalAlpha=0.4; ctx.strokeStyle=C.rusher; ctx.lineWidth=2;
        for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(e.x+e.w+4,e.y+8+i*9);ctx.lineTo(e.x+e.w+22,e.y+8+i*9);ctx.stroke();}
        ctx.restore(); break;
      case 'swooper':
        ctx.beginPath(); ctx.moveTo(e.x+e.w/2,e.y+e.h); ctx.lineTo(e.x,e.y); ctx.lineTo(e.x+e.w,e.y);
        ctx.closePath(); ctx.fill(); break;
      default:
        ctx.fillRect(e.x,e.y,e.w,e.h);
        ctx.fillStyle='#fff'; ctx.fillRect(e.x+e.w*0.55,e.y+e.h*0.2,6,6);
        ctx.fillStyle='#f00'; ctx.fillRect(e.x+e.w*0.6,e.y+e.h*0.22,3,3);
        if (e.type==='fly') {
          ctx.save(); ctx.globalAlpha=0.6; ctx.fillStyle=e.color;
          const wf = Math.sin(state.frame*0.25)*8;
          ctx.fillRect(e.x-12,e.y+wf,12,5); ctx.fillRect(e.x+e.w,e.y-wf,12,5);
          ctx.restore();
        }
    }
    ctx.restore();
  });

  // Particles
  state.particles.forEach(pt => {
    ctx.save(); ctx.globalAlpha=pt.life; ctx.shadowColor=pt.color; ctx.shadowBlur=8;
    ctx.fillStyle=pt.color; ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r*pt.life,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });

  // Player trail
  const p = state.player;
  p.trail.forEach(t => {
    if (t.t <= 0) return;
    ctx.save(); ctx.globalAlpha=t.t*0.3; ctx.shadowColor=C.player; ctx.shadowBlur=10;
    ctx.fillStyle=C.player;
    const s = p.w*t.t*0.7;
    ctx.fillRect(t.x-s/2, t.y-p.h*t.t*0.5, s, p.h*t.t*0.7);
    ctx.restore();
  });

  // Player
  const flash = p.invincible > 0 && Math.floor(p.invincible/5)%2===0;
  if (!flash) {
    ctx.save();
    ctx.shadowColor=C.player; ctx.shadowBlur=28; ctx.fillStyle=C.player;
    // Flip sprite based on walk direction
    if (p.walkDir < 0) {
      ctx.save();
      ctx.translate(p.x + p.w, 0); ctx.scale(-1,1);
      drawPlayerBody(0, p.y, p.w, p.h, p.dashing);
      ctx.restore();
    } else {
      drawPlayerBody(p.x, p.y, p.w, p.h, p.dashing);
    }
    ctx.restore();
  }

  if (state.phase === 'title') drawTitleScreen();
  if (state.phase === 'dead')  drawDeadScreen();
  ctx.restore();
}

function drawPlayerBody(x, y, w, h, dashing) {
  ctx.fillStyle = C.player;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#001a2a';
  ctx.fillRect(x+5, y+7, w-10, 10);
  ctx.fillStyle = 'rgba(0,255,255,0.5)';
  ctx.fillRect(x+6, y+8, w-12, 5);
  if (dashing) {
    ctx.save(); ctx.globalAlpha=0.5; ctx.shadowBlur=50;
    ctx.strokeStyle='#0ff'; ctx.lineWidth=3;
    ctx.strokeRect(x, y, w, h);
    ctx.restore();
  }
}

function neonText(text, x, y, size, color, blur) {
  ctx.save();
  ctx.font=`900 ${size}px Orbitron, monospace`; ctx.textAlign='center';
  ctx.shadowColor=color; ctx.shadowBlur=blur||20; ctx.fillStyle=color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawTitleScreen() {
  ctx.save(); ctx.fillStyle='rgba(0,0,10,0.75)'; ctx.fillRect(0,0,W,H); ctx.restore();
  neonText('NEON RUNNER', W/2, H/2-65, 52, '#0ff', 40);
  neonText('CYBERPUNK EDITION', W/2, H/2-20, 14, '#f0f', 20);
  if (cloudHi > 0) neonText(`☁ CLOUD HI: ${cloudHi}`, W/2, H/2+10, 12, '#ff0', 12);
  const a = 0.5+0.5*Math.sin(Date.now()*0.004);
  ctx.save(); ctx.globalAlpha=a;
  neonText('PRESS SPACE / JUMP TO START', W/2, H/2+48, 13, '#fff', 12);
  ctx.restore();
  neonText('← → MOVE  |  ▲ JUMP x2  |  ⚡ DASH  |  6 ENEMY TYPES', W/2, H/2+88, 8.5, '#0ff8', 6);
}

function drawDeadScreen() {
  ctx.save(); ctx.fillStyle='rgba(0,0,10,0.82)'; ctx.fillRect(0,0,W,H); ctx.restore();
  neonText('GAME OVER', W/2, H/2-65, 54, '#f0f', 40);
  neonText(`SCORE: ${state.score}`, W/2, H/2-10, 22, '#0ff', 18);
  neonText(`LOKAL HI: ${localHi}`, W/2, H/2+22, 13, '#fff', 10);
  neonText(`☁ CLOUD HI: ${cloudHi}`, W/2, H/2+44, 13, '#ff0', 12);
  neonText(`LEVEL REACHED: ${state.level}`, W/2, H/2+64, 10, '#f0f', 8);
  const a = 0.5+0.5*Math.sin(Date.now()*0.005);
  ctx.save(); ctx.globalAlpha=a;
  neonText('PRESS SPACE / JUMP TO RETRY', W/2, H/2+88, 12, '#fff', 11);
  ctx.restore();
}

function updateHUD() {
  document.getElementById('h-score').textContent = state.score;
  const hi = Math.max(localHi, cloudHi);
  document.getElementById('h-hi').textContent = hi > 0 ? hi : '—';
  document.getElementById('h-lives').textContent = '♥️ '.repeat(Math.max(0,state.lives)).trim() || '—';
  document.getElementById('h-lvl').textContent = state.level;
}

// ─── Loop ──────────────────────────────────────────────────────
function loop() { update(); draw(); requestAnimationFrame(loop); }
init();
loop();
</script>
</body>
</html>
